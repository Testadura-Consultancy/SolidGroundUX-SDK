# Framework-wide system configuration directory
    SGND_SYSCFG_DIR=/srv/storage/development/SolidGroundUX-SDK/target-root/etc/solidgroundux

    # Framework-wide documentation directory
    SGND_DOCS_DIR=/srv/storage/development/SolidGroundUX-SDK/target-root/usr/local/share/doc

    # Controls console message visibility. Supported values are silent, quiet, normal, verbose, debug, and trace.
    SGND_CONSOLE_LOG_LEVEL=silent

    # Controls file message visibility. Supported values are silent, quiet, normal, verbose, debug, and trace.
    SGND_FILE_LOG_LEVEL=verbose

    # Primary log file or directory path
    SGND_LOG_PATH=/srv/storage/development/SolidGroundUX-SDK/target-root/var/log/solidgroundux.log

    # Alternate log path override
    SGND_ALTLOG_PATH=/home/sysadmin/.log/solidgroundux.log

    # Maximum log file size before rotation
    SGND_LOG_MAX_BYTES=26214400

    # Number of rotated log files to retain
    SGND_LOG_KEEP=20

    # Compress rotated log files
    SGND_LOG_COMPRESS=1

    # Default UI style file (basename or path)
    SGND_UI_STYLE=00-style-default.sh

    # Default UI palette file (basename or path)
    SGND_UI_PALETTE=default-ui-palette.sh

    # Default delay in seconds after warning messages; -1 waits for a keypress.
    SGND_UI_WARNING_DELAY=0.5

    # Default delay in seconds after error messages; -1 waits for a keypress.
    SGND_UI_ERROR_DELAY=0.5

    # Prefered standard console width
    SGND_CONSOLE_WIDTH=80

    # Render width upper limit
    SGND_MAX_RENDER_WIDTH=140

    