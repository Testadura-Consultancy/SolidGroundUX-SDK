<p class="ct-variablebody">State persistence toggle used by sgnd_bootstrap when state support is enabled.</p>
<div class="ct-variablebody"></div>
<p class="ct-variablebody">Scripts that want persistent state must:</p>
<div class="ct-variablebody">  1) set SGND_STATE_SAVE=1</div>
<div class="ct-variablebody">  2) call sgnd_bootstrap --state or --autostate</div>
